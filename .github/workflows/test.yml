name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
      MORPHTILE_COMMIT: 26b89a77f6a90715a6742dc4d084008ba63731b6
      SURFACE_PRODUCER_REPOSITORY: mike-axiom-mir/axm-morphtile-machine-surface
      SURFACE_PRODUCER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: 26b89a77f6a90715a6742dc4d084008ba63731b6
          path: .runtime/morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run evidence:render
      - uses: actions/upload-artifact@v4
        with:
          name: surface-render-evidence
          path: evidence/surface
          if-no-files-found: error
